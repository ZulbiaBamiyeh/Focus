<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Focus</title>
    <meta name="description" content="A focus timer with a floating island that grows one thing for every block you finish. Pomodoro, Flowtime, countdown and stopwatch, with a game-OST music station." />
    <meta name="theme-color" content="#FFD9B8" />

    <meta property="og:description" content="Every focus block grows something on your island." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* Holds a dawn sky until the first frame, so there's no white flash. */
      html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #A9B6DE 0%, #FFC9A3 62%, #F6CFC0 100%); }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="Your island. Drag to look around, scroll or pinch to zoom." role="img"></canvas>
    <div id="hud"></div>
    <noscript>Focus needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
