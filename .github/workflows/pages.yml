name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is currently the claude/* branch; main is
    # listed too so nothing breaks if it's later renamed or merged there.
    branches: [main, claude/deploy-cloudflare-pages-70to2x]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC. No secrets needed.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # base must match the path Pages serves this repo from.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA + Jekyll guards
        # Pages runs Jekyll by default, which drops files starting with an
        # underscore; .nojekyll turns that off. 404.html makes deep links work.
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo the first time this runs, so there's no
        # manual step in Settings before the first deploy.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
